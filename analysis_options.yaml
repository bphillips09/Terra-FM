include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - native/**
    - third_party/**
    - android/**
    - linux/**
    - macos/**
    - windows/**
    - lib/src/native/terra_bindings.g.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unawaited_futures: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
