name: terra
description: "Terra FM: HD (NRSC-5) and FM receiver for USB tuners."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  terra_usb:
    path: packages/terra_usb

dev_dependencies:
  ffigen: ^22.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - THIRD_PARTY_NOTICES.md
    - assets/maps/north_america.tbm
