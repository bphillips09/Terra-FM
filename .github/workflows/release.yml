name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: fvm
        shell: bash
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies
        run: flutter pub get

      - name: Compute version label
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="$(awk -F': ' '/^version:/{print $2; exit}' pubspec.yaml)"
          fi
          SANITIZED="$(echo "${RAW_VERSION}" | sed -E 's/^v?//; s/[^0-9.].*$//; s/\.//g')"
          VERSION_LABEL="v${SANITIZED}"
          echo "label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "TerraFM-${{ steps.version.outputs.label }}-Android.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TerraFM-${{ steps.version.outputs.label }}-Android
          path: TerraFM-${{ steps.version.outputs.label }}-Android.apk
          if-no-files-found: error

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: fvm
        shell: bash
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install native build tools
        run: brew install cmake ninja

      - name: Install dependencies
        run: flutter pub get

      - name: Compute version label
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="$(awk -F': ' '/^version:/{print $2; exit}' pubspec.yaml)"
          fi
          SANITIZED="$(echo "${RAW_VERSION}" | sed -E 's/^v?//; s/[^0-9.].*$//; s/\.//g')"
          VERSION_LABEL="v${SANITIZED}"
          echo "label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          shopt -s nullglob
          APPS=(build/macos/Build/Products/Release/*.app)
          if [ ${#APPS[@]} -eq 0 ]; then
            echo "No .app bundle found in macOS build output."
            exit 1
          fi
          APP_PATH="${APPS[0]}"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "TerraFM-${{ steps.version.outputs.label }}-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerraFM-${{ steps.version.outputs.label }}-macOS
          path: TerraFM-${{ steps.version.outputs.label }}-macOS.zip
          if-no-files-found: error

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_android
      - build_macos
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          cp dist/TerraFM-*-Android/TerraFM-*-Android.apk .
          cp dist/TerraFM-*-macOS/TerraFM-*-macOS.zip .
          ls -la

      - name: Publish release and upload files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TerraFM-*-Android.apk
            TerraFM-*-macOS.zip
